{% extends "base.html" %}

{% block content %}
<div class="container">
    <p> Bonjour:  {{ user.username }} </p>
    <p class="subtitle">Liste des abonnés</p>
    {% if followers %}
            <ul class="followers-list">
                {% for follower in followers %}
                    <li class="follower-item">
                        {{ follower.username }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Aucun abonné pour le moment.</p>
    {% endif %}
</div>
{% endblock %}
