{%extends "base.html"%}
{% block content %}
<div class="container">

    <p class="create_text">Ajouter un ticket</p>

    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <!-- champs générés par Django -->
        {{ ticket_form.as_p }}
        <!-- bouton Envoyer aligné à droite -->
        <div class="action-buttons">            
        <input type="submit" value="Envoyer le ticket" class="btn">
        </div>
    </form>
</div>

{% endblock %}
