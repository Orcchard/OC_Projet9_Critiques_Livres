{% extends 'base.html' %}

{% block content %}
    {% if ticket.image %}
        <img src="{{ ticket.image.url }}" alt="Couverture de {{ ticket.title }}">
    {% else %}
        <p><em>Aucune couverture disponible.</em></p>
    {% endif %}

    <p><strong>Titre :</strong> {{ ticket.title|default:"Non renseigné" }}</p>
    <p><strong>Description :</strong> {{ ticket.description|default:"Non renseigné" }}</p>

    
{% endblock %}
